<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Clock</title>
    <link rel="stylesheet" href="src/styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.31.0/moment-with-locales.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.46/moment-timezone-with-data.min.js"></script>
  </head>
  <body>
    <div class="clock-container">
      <h1>World Clock</h1>

      <select id="cities">
        <option value="">Select a City</option>
        <option value="current">My Location</option>
        <option value="America/New_York">New York</option>
        <option value="Europe/London">London</option>
        <option value="Asia/Tokyo">Tokyo</option>
        <option value="Australia/Sydney">Sydney</option>
      </select>
      <div id="selected-city">
        <div class="city" id="oklahoma-city">
          <div>
            <h2>Oklahoma City</h2>
            <div class="date">October 26, 2026</div>
          </div>
          <div class="time"><small></small></div>
        </div>
        <div class="city" id="new-york">
          <div>
            <h2>New York</h2>
            <div class="date">October 26, 2026</div>
          </div>
          <div class="time"><small></small></div>
        </div>
        <div class="city" id="los-angeles">
          <div>
            <h2>Los Angeles</h2>
            <div class="date">October 26, 2026</div>
          </div>
          <div class="time"><small></small></div>
        </div>
      </div>
    </div>
    <footer>
      This project was coded by <strong>Eden Tetreault</strong> and is
      <a href="https://github.com/mrstetreault/WorldClock.ET" target="_blank"
        >open sourced on GitHub</a
      >.
    </footer>
    <script src="src/index.js"></script>
  </body>
</html>
